services:
  postgres:
    image: postgres:18
    container_name: ledgerlite-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledgerlite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerlite"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
